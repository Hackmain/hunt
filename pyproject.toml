[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunt"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "asciinema>=2.4.0",
]

[tool.setuptools.packages.find]
include = ["hunt_cli*"]

[project.scripts]
hunt = "hunt_cli.__main__:main"
